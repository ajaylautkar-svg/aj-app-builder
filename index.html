<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ App Builder</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#1976d2;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{margin:0 0 7px}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#1976d2;
  color:white;
  border:none;
  cursor:pointer;
}

.delete{
  background:#d32f2f;
}

.element{
  background:#f5f5f5;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
}

.preview{
  border:2px solid #ddd;
  border-radius:15px;
  overflow:hidden;
  background:white;
}

.preview-header{
  padding:18px;
  color:white;
  text-align:center;
}

.preview-body{
  padding:20px;
  min-height:250px;
}

.preview-button{
  display:block;
  padding:12px;
  margin:15px 0;
  border-radius:8px;
  color:white;
  text-align:center;
  text-decoration:none;
}

.preview-image{
  max-width:100%;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h1>🚀 AJ App Builder</h1>
<p>अपनी खुद की App आसानी से बनाएं</p>
</header>

<div class="container">

<div class="card">

<h2>📱 App Settings</h2>

<label>App का नाम</label>

<input
id="appName"
type="text"
placeholder="My Business App"
oninput="updatePreview()"
>

<label>Theme Color</label>

<select id="themeColor" onchange="updatePreview()">
<option value="#1976d2">Blue</option>
<option value="#2e7d32">Green</option>
<option value="#7b1fa2">Purple</option>
<option value="#ef6c00">Orange</option>
<option value="#c62828">Red</option>
</select>

</div>


<div class="card">

<h2>📄 App Pages</h2>

<input
id="pageName"
type="text"
placeholder="Page का नाम जैसे Home"
>

<button onclick="addPage()">➕ Add Page</button>

<div id="pagesList"></div>

</div>


<div class="card">

<h2>🧩 Add Elements</h2>

<button onclick="addText()">📝 Add Text</button>

<button onclick="addButton()">🔘 Add Button</button>

<button onclick="addImage()">🖼️ Add Image</button>

<div id="elementsList"></div>

</div>


<div class="card">

<h2>👀 Live Preview</h2>

<div class="preview">

<div
class="preview-header"
id="previewHeader"
>

<h2 id="previewTitle">
My App
</h2>

</div>

<div
class="preview-body"
id="previewBody"
>

<p>
आपकी App का Preview यहाँ दिखाई देगा।
</p>

</div>

</div>

</div>


<div class="card">

<h2>💾 Save</h2>

<button onclick="saveApp()">
💾 Save App
</button>

<button
class="delete"
onclick="clearApp()"
>
🗑️ Clear App
</button>

</div>

</div>


<script>

let pages=[];

let elements=[];


/* UPDATE PREVIEW */

function updatePreview(){

let name=
document.getElementById("appName").value;

let color=
document.getElementById("themeColor").value;

if(name.trim()===""){
name="My App";
}

document.getElementById(
"previewTitle"
).innerText=name;

document.getElementById(
"previewHeader"
).style.background=color;

showElements();

}


/* ADD PAGE */

function addPage(){

let input=
document.getElementById("pageName");

let name=
input.value.trim();

if(name===""){

alert("पहले Page का नाम लिखें");

return;

}

pages.push(name);

input.value="";

showPages();

}


/* SHOW PAGES */

function showPages(){

let box=
document.getElementById("pagesList");

box.innerHTML="";

pages.forEach(function(page,index){

let div=
document.createElement("div");

div.className="element";

div.innerHTML=
"📄 "+page+
'<button class="delete" onclick="deletePage('+
index+
')">Delete</button>';

box.appendChild(div);

});

}


/* DELETE PAGE */

function deletePage(index){

pages.splice(index,1);

showPages();

}


/* ADD TEXT */

function addText(){

let text=
prompt(
"अपना Text लिखें",
"Welcome to my App"
);

if(
text===null ||
text.trim()===""
){
return;
}

elements.push({

type:"text",

value:text

});

showElements();

}


/* ADD BUTTON */

function addButton(){

let text=
prompt(
"Button पर क्या लिखा हो?",
"Contact Us"
);

if(
text===null ||
text.trim()===""
){
return;
}


let url=
prompt(
"Button दबाने पर कौन-सी website खुले?",
"https://example.com"
);

if(
url===null ||
url.trim()===""
){
return;
}


elements.push({

type:"button",

value:text,

url:url

});

showElements();

}


/* ADD IMAGE */

function addImage(){

let url=
prompt(
"Image का URL डालें",
"https://picsum.photos/500/300"
);

if(
url===null ||
url.trim()===""
){
return;
}

elements.push({

type:"image",

value:url

});

showElements();

}


/* SHOW ELEMENTS */

function showElements(){

let preview=
document.getElementById("previewBody");

let list=
document.getElementById("elementsList");

preview.innerHTML="";

list.innerHTML="";


elements.forEach(function(el,index){

/* TEXT */

if(el.type==="text"){

let p=
document.createElement("p");

p.innerText=el.value;

p.style.fontSize="18px";

preview.appendChild(p);

}


/* BUTTON */

if(el.type==="button"){

let a=
document.createElement("a");

a.innerText=el.value;

a.href=el.url;

a.target="_blank";

a.className="preview-button";

a.style.background=
document.getElementById(
"themeColor"
).value;

preview.appendChild(a);

}


/* IMAGE */

if(el.type==="image"){

let img=
document.createElement("img");

img.src=el.value;

img.className="preview-image";

img.onerror=function(){

img.alt="Image load नहीं हुई";

};

preview.appendChild(img);

}


/* ELEMENT LIST */

let item=
document.createElement("div");

item.className="element";

let extra="";

if(el.type==="button"){

extra=
" → "+el.url;

}

item.innerHTML=
"🧩 "+
el.type+
" : "+
el.value+
extra+
'<button class="delete" onclick="deleteElement('+
index+
')">Delete</button>';

list.appendChild(item);

});

}


/* DELETE ELEMENT */

function deleteElement(index){

elements.splice(index,1);

showElements();

}


/* SAVE APP */

function saveApp(){

let app={

name:
document.getElementById(
"appName"
).value,

color:
document.getElementById(
"themeColor"
).value,

pages:pages,

elements:elements

};

localStorage.setItem(
"AJ_APP",
JSON.stringify(app)
);

alert(
"✅ App successfully save हो गई!"
);

}


/* CLEAR */

function clearApp(){

localStorage.removeItem("AJ_APP");

pages=[];

elements=[];

document.getElementById(
"appName"
).value="";

showPages();

showElements();

updatePreview();

}


/* LOAD */

function loadApp(){

let saved=
localStorage.getItem("AJ_APP");

if(!saved){

updatePreview();

return;

}

let app=
JSON.parse(saved);

document.getElementById(
"appName"
).value=
app.name || "";

document.getElementById(
"themeColor"
).value=
app.color || "#1976d2";

pages=
app.pages || [];

elements=
app.elements || [];

showPages();

showElements();

updatePreview();

}


loadApp();

</script>

</body>
  </html>
