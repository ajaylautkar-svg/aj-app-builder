<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJ App Builder</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0 0 7px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  background:#2563eb;
  color:white;
  border:0;
  cursor:pointer;
}

.delete{
  background:#dc2626;
}

.element{
  background:#f3f4f6;
  padding:12px;
  margin-top:8px;
  border-radius:9px;
}

.builder{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}

.phone-area{
  display:flex;
  justify-content:center;
}

.phone{
  width:320px;
  max-width:100%;
  background:#111;
  padding:10px;
  border-radius:35px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.phone-screen{
  background:white;
  border-radius:27px;
  overflow:hidden;
  min-height:560px;
  position:relative;
}

.app-header{
  color:white;
  padding:18px 12px;
  text-align:center;
}

.app-header h2{
  margin:0;
}

.app-content{
  padding:18px;
  min-height:440px;
}

.app-page-button{
  width:100%;
  background:#f1f5f9;
  color:#222;
  margin:5px 0;
}

.preview-button{
  display:block;
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:9px;
  color:white;
  text-decoration:none;
  text-align:center;
}

.preview-image{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
  margin:8px 0;
}

.home-text{
  color:#666;
  text-align:center;
  margin-bottom:20px;
}

@media(min-width:750px){
  .builder{
    grid-template-columns:1fr 1fr;
    align-items:start;
  }
}
</style>
</head>

<body>

<header>
<h1>🚀 AJ App Builder</h1>
<p>अपनी खुद की Mobile App बनाएं</p>
</header>

<div class="container">

<div class="builder">

<!-- SETTINGS -->

<div>

<div class="card">

<h2>📱 App Settings</h2>

<label>App का नाम</label>

<input
id="appName"
type="text"
placeholder="My Business App"
oninput="updatePreview()"
>

<label>Theme Color</label>

<select
id="themeColor"
onchange="updatePreview()"
>

<option value="#2563eb">Blue</option>
<option value="#16a34a">Green</option>
<option value="#9333ea">Purple</option>
<option value="#ea580c">Orange</option>
<option value="#dc2626">Red</option>

</select>

</div>


<!-- PAGES -->

<div class="card">

<h2>📄 Pages</h2>

<input
id="pageName"
type="text"
placeholder="Home, About, Contact..."
>

<button onclick="addPage()">
➕ Add Page
</button>

<div id="pagesList"></div>

</div>


<!-- ELEMENTS -->

<div class="card">

<h2>🧩 Elements</h2>

<button onclick="addText()">
📝 Add Text
</button>

<button onclick="addButton()">
🔘 Add Button
</button>

<button onclick="addImage()">
🖼️ Add Image
</button>

<div id="elementsList"></div>

</div>


<!-- SAVE -->

<div class="card">

<button onclick="saveApp()">
💾 Save App
</button>

<button
class="delete"
onclick="clearApp()"
>
🗑️ Clear App
</button>

</div>

</div>


<!-- MOBILE PREVIEW -->

<div>

<div class="card">

<h2>👀 Mobile Preview</h2>

<div class="phone">

<div class="phone-screen">

<div
class="app-header"
id="appHeader"
>

<h2 id="previewTitle">
My App
</h2>

</div>

<div
class="app-content"
id="appContent"
>

<div class="home-text">
Welcome to your App
</div>

</div>

</div>

</div>

</div>

</div>

</div>

</div>


<script>

let pages=[];

let elements=[];


/* UPDATE */

function updatePreview(){

let name=
document.getElementById("appName").value;

let color=
document.getElementById("themeColor").value;

if(name.trim()===""){
name="My App";
}

document.getElementById(
"previewTitle"
).innerText=name;

document.getElementById(
"appHeader"
).style.background=color;

showElements();

showPagesPreview();

}


/* ADD PAGE */

function addPage(){

let input=
document.getElementById("pageName");

let name=
input.value.trim();

if(name===""){

alert("Page का नाम लिखें");

return;

}

pages.push(name);

input.value="";

showPages();

showPagesPreview();

}


/* SHOW PAGE LIST */

function showPages(){

let box=
document.getElementById("pagesList");

box.innerHTML="";

pages.forEach(function(page,index){

let div=
document.createElement("div");

div.className="element";

div.innerHTML=
"📄 "+page+
'<button class="delete" onclick="deletePage('+
index+
')">Delete</button>';

box.appendChild(div);

});

}


/* PAGE PREVIEW */

function showPagesPreview(){

let content=
document.getElementById("appContent");

if(pages.length===0){

return;

}

let old=
document.getElementById("pageNavigation");

if(old){
old.remove();
}

let nav=
document.createElement("div");

nav.id="pageNavigation";

pages.forEach(function(page){

let btn=
document.createElement("button");

btn.className=
"app-page-button";

btn.innerText=
"📄 "+page;

btn.onclick=function(){

alert(
"You opened: "+page
);

};

nav.appendChild(btn);

});

content.insertBefore(
nav,
content.firstChild
);

}


/* DELETE PAGE */

function deletePage(index){

pages.splice(index,1);

showPages();

showPagesPreview();

}


/* TEXT */

function addText(){

let text=
prompt(
"अपना Text लिखें",
"Welcome to my App"
);

if(
text===null ||
text.trim()===""
){
return;
}

elements.push({

type:"text",
value:text

});

showElements();

}


/* BUTTON */

function addButton(){

let text=
prompt(
"Button का नाम",
"Contact Us"
);

if(
text===null ||
text.trim()===""
){
return;
}

let url=
prompt(
"Button URL",
"https://example.com"
);

if(
url===null ||
url.trim()===""
){
return;
}

elements.push({

type:"button",
value:text,
url:url

});

showElements();

}


/* IMAGE */

function addImage(){

let url=
prompt(
"Image URL",
"https://picsum.photos/500/300"
);

if(
url===null ||
url.trim()===""
){
return;
}

elements.push({

type:"image",
value:url

});

showElements();

}


/* SHOW ELEMENTS */

function showElements(){

let content=
document.getElementById("appContent");

let old=
document.getElementById("elementsPreview");

if(old){
old.remove();
}

let wrapper=
document.createElement("div");

wrapper.id=
"elementsPreview";


elements.forEach(function(el){

if(el.type==="text"){

let p=
document.createElement("p");

p.innerText=
el.value;

p.style.fontSize=
"17px";

wrapper.appendChild(p);

}


if(el.type==="button"){

let a=
document.createElement("a");

a.innerText=
el.value;

a.href=
el.url;

a.target=
"_blank";

a.className=
"preview-button";

a.style.background=
document.getElementById(
"themeColor"
).value;

wrapper.appendChild(a);

}


if(el.type==="image"){

let img=
document.createElement("img");

img.src=
el.value;

img.className=
"preview-image";

wrapper.appendChild(img);

}

});

content.appendChild(wrapper);


/* ELEMENT LIST */

let list=
document.getElementById("elementsList");

list.innerHTML="";

elements.forEach(function(el,index){

let item=
document.createElement("div");

item.className=
"element";

item.innerHTML=
"🧩 "+
el.type+
" : "+
el.value+
'<button class="delete" onclick="deleteElement('+
index+
')">Delete</button>';

list.appendChild(item);

});

}


/* DELETE ELEMENT */

function deleteElement(index){

elements.splice(index,1);

showElements();

}


/* SAVE */

function saveApp(){

let app={

name:
document.getElementById("appName").value,

color:
document.getElementById("themeColor").value,

pages:pages,

elements:elements

};

localStorage.setItem(
"AJ_APP",
JSON.stringify(app)
);

alert(
"✅ App Save हो गई!"
);

}


/* CLEAR */

function clearApp(){

localStorage.removeItem("AJ_APP");

pages=[];

elements=[];

document.getElementById(
"appName"
).value="";

showPages();

showElements();

updatePreview();

}


/* LOAD */

function loadApp(){

let saved=
localStorage.getItem("AJ_APP");

if(!saved){

updatePreview();

return;

}

let app=
JSON.parse(saved);

document.getElementById(
"appName"
).value=
app.name || "";

document.getElementById(
"themeColor"
).value=
app.color || "#2563eb";

pages=
app.pages || [];

elements=
app.elements || [];

showPages();

updatePreview();

}


loadApp();

</script>

</body>
  </html>
