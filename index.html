<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ App Builder</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{margin:0 0 7px}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,textarea,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#2563eb;
  color:white;
  border:0;
  cursor:pointer;
}

.green{background:#16a34a}
.orange{background:#ea580c}
.red{background:#dc2626}

.builder{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}

.phone-area{
  display:flex;
  justify-content:center;
}

.phone{
  width:320px;
  max-width:100%;
  background:#111;
  padding:10px;
  border-radius:35px;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.phone-screen{
  background:white;
  border-radius:27px;
  overflow:hidden;
  min-height:570px;
}

.app-header{
  color:white;
  padding:18px 12px;
  text-align:center;
}

.app-header img{
  width:60px;
  height:60px;
  border-radius:15px;
  object-fit:cover;
  background:white;
}

.app-header h2{
  margin:8px 0 0;
}

.app-content{
  padding:18px;
  min-height:450px;
}

.element{
  background:#f3f4f6;
  padding:12px;
  margin-top:8px;
  border-radius:9px;
}

.delete{
  background:#dc2626;
}

.preview-button{
  display:block;
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:9px;
  color:white;
  text-decoration:none;
  text-align:center;
}

.preview-image{
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:10px;
  margin:8px 0;
}

.status{
  padding:12px;
  background:#ecfdf5;
  border-radius:10px;
  margin-top:10px;
  color:#166534;
  display:none;
}

@media(min-width:750px){
  .builder{
    grid-template-columns:1fr 1fr;
    align-items:start;
  }
}
</style>
</head>

<body>

<header>
<h1>🚀 AJ App Builder</h1>
<p>अपनी खुद की Mobile App बनाएं</p>
</header>

<div class="container">

<div class="builder">

<div>

<!-- APP INFORMATION -->

<div class="card">

<h2>📱 App Information</h2>

<label>App का नाम</label>

<input
id="appName"
type="text"
placeholder="My Business App"
oninput="updatePreview()"
>

<label>App Description</label>

<textarea
id="appDescription"
placeholder="मेरी App के बारे में..."
oninput="updatePreview()"
></textarea>

<label>Version</label>

<input
id="appVersion"
type="text"
value="1.0.0"
>

<label>Logo URL</label>

<input
id="logoUrl"
type="text"
placeholder="https://example.com/logo.png"
oninput="updatePreview()"
>

<label>Theme Color</label>

<select
id="themeColor"
onchange="updatePreview()"
>

<option value="#2563eb">Blue</option>
<option value="#16a34a">Green</option>
<option value="#9333ea">Purple</option>
<option value="#ea580c">Orange</option>
<option value="#dc2626">Red</option>

</select>

</div>


<!-- PAGES -->

<div class="card">

<h2>📄 Pages</h2>

<input
id="pageName"
type="text"
placeholder="Home, About, Contact..."
>

<button onclick="addPage()">
➕ Add Page
</button>

<div id="pagesList"></div>

</div>


<!-- ELEMENTS -->

<div class="card">

<h2>🧩 Elements</h2>

<button onclick="addText()">
📝 Add Text
</button>

<button onclick="addButton()">
🔘 Add Button
</button>

<button onclick="addImage()">
🖼️ Add Image
</button>

<div id="elementsList"></div>

</div>


<!-- GENERATE -->

<div class="card">

<h2>🚀 Generate App</h2>

<button
class="green"
onclick="generateApp()"
>
🚀 Generate App
</button>

<button
class="orange"
onclick="downloadProject()"
>
📦 Download Project
</button>

<button
class="red"
onclick="clearApp()"
>
🗑️ Clear App
</button>

<div
id="status"
class="status"
></div>

</div>

</div>


<!-- PREVIEW -->

<div>

<div class="card">

<h2>👀 Mobile Preview</h2>

<div class="phone">

<div class="phone-screen">

<div
class="app-header"
id="appHeader"
>

<img
id="previewLogo"
style="display:none"
>

<h2 id="previewTitle">
My App
</h2>

</div>

<div
class="app-content"
id="appContent"
>

<p id="previewDescription">
Welcome to your App
</p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>


<script>

let pages=[];

let elements=[];


/* UPDATE PREVIEW */

function updatePreview(){

let name=
document.getElementById("appName").value;

let description=
document.getElementById("appDescription").value;

let color=
document.getElementById("themeColor").value;

let logo=
document.getElementById("logoUrl").value;


if(name.trim()===""){
name="My App";
}

if(description.trim()===""){
description="Welcome to your App";
}


document.getElementById(
"previewTitle"
).innerText=name;

document.getElementById(
"previewDescription"
).innerText=description;

document.getElementById(
"appHeader"
).style.background=color;


/* LOGO */

let logoBox=
document.getElementById("previewLogo");

if(logo.trim()!==""){

logoBox.src=logo;

logoBox.style.display="block";

}else{

logoBox.style.display="none";

}


showElements();

}


/* ADD PAGE */

function addPage(){

let input=
document.getElementById("pageName");

let name=
input.value.trim();

if(name===""){

alert("Page का नाम लिखें");

return;

}

pages.push(name);

input.value="";

showPages();

}


/* SHOW PAGES */

function showPages(){

let box=
document.getElementById("pagesList");

box.innerHTML="";

pages.forEach(function(page,index){

let div=
document.createElement("div");

div.className="element";

div.innerHTML=
"📄 "+page+
'<button class="delete" onclick="deletePage('+
index+
')">Delete</button>';

box.appendChild(div);

});

}


/* DELETE PAGE */

function deletePage(index){

pages.splice(index,1);

showPages();

}


/* ADD TEXT */

function addText(){

let text=
prompt(
"अपना Text लिखें",
"Welcome to my App"
);

if(
text===null ||
text.trim()===""
){
return;
}

elements.push({

type:"text",
value:text

});

showElements();

}


/* ADD BUTTON */

function addButton(){

let text=
prompt(
"Button का नाम",
"Contact Us"
);

if(
text===null ||
text.trim()===""
){
return;
}

let url=
prompt(
"Button URL",
"https://example.com"
);

if(
url===null ||
url.trim()===""
){
return;
}

elements.push({

type:"button",
value:text,
url:url

});

showElements();

}


/* ADD IMAGE */

function addImage(){

let url=
prompt(
"Image URL",
"https://picsum.photos/500/300"
);

if(
url===null ||
url.trim()===""
){
return;
}

elements.push({

type:"image",
value:url

});

showElements();

}


/* SHOW ELEMENTS */

function showElements(){

let content=
document.getElementById("appContent");

let old=
document.getElementById("elementsPreview");

if(old){
old.remove();
}

let wrapper=
document.createElement("div");

wrapper.id="elementsPreview";


elements.forEach(function(el){

if(el.type==="text"){

let p=
document.createElement("p");

p.innerText=el.value;

p.style.fontSize="17px";

wrapper.appendChild(p);

}


if(el.type==="button"){

let a=
document.createElement("a");

a.innerText=el.value;

a.href=el.url;

a.target="_blank";

a.className="preview-button";

a.style.background=
document.getElementById(
"themeColor"
).value;

wrapper.appendChild(a);

}


if(el.type==="image"){

let img=
document.createElement("img");

img.src=el.value;

img.className="preview-image";

wrapper.appendChild(img);

}

});


content.appendChild(wrapper);


/* ELEMENT LIST */

let list=
document.getElementById("elementsList");

list.innerHTML="";

elements.forEach(function(el,index){

let item=
document.createElement("div");

item.className="element";

item.innerHTML=
"🧩 "+
el.type+
" : "+
el.value+
'<button class="delete" onclick="deleteElement('+
index+
')">Delete</button>';

list.appendChild(item);

});

}


/* DELETE ELEMENT */

function deleteElement(index){

elements.splice(index,1);

showElements();

}


/* COLLECT PROJECT */

function getProject(){

return {

name:
document.getElementById("appName").value,

description:
document.getElementById("appDescription").value,

version:
document.getElementById("appVersion").value,

logo:
document.getElementById("logoUrl").value,

color:
document.getElementById("themeColor").value,

pages:pages,

elements:elements,

created:
new Date().toISOString()

};

}


/* SAVE */

function saveApp(){

let project=getProject();

localStorage.setItem(
"AJ_APP",
JSON.stringify(project)
);

showStatus(
"✅ App project save हो गया!"
);

}


/* GENERATE */

function generateApp(){

let project=getProject();

if(project.name.trim()===""){

alert("पहले App का नाम लिखें");

return;

}

localStorage.setItem(
"AJ_APP",
JSON.stringify(project)
);

showStatus(
"🚀 App generate हो गई! अब Download Project से project file ले सकते हैं।"
);

}


/* DOWNLOAD PROJECT */

function downloadProject(){

let project=getProject();

let data=
JSON.stringify(
project,
null,
2
);

let blob=
new Blob(
[data],
{type:"application/json"}
);

let url=
URL.createObjectURL(blob);

let a=
document.createElement("a");

a.href=url;

a.download=
(project.name || "AJ-App")
.replace(/\s+/g,"-")+
"-project.json";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

showStatus(
"📦 Project file download शुरू हो गई।"
);

}


/* STATUS */

function showStatus(message){

let box=
document.getElementById("status");

box.innerText=message;

box.style.display="block";

}


/* CLEAR */

function clearApp(){

localStorage.removeItem("AJ_APP");

pages=[];

elements=[];

document.getElementById(
"appName"
).value="";

document.getElementById(
"appDescription"
).value="";

document.getElementById(
"appVersion"
).value="1.0.0";

document.getElementById(
"logoUrl"
).value="";

showPages();

showElements();

updatePreview();

showStatus(
"App clear हो गई।"
);

}


/* LOAD */

function loadApp(){

let saved=
localStorage.getItem("AJ_APP");

if(!saved){

updatePreview();

return;

}

try{

let app=
JSON.parse(saved);

document.getElementById(
"appName"
).value=
app.name || "";

document.getElementById(
"appDescription"
).value=
app.description || "";

document.getElementById(
"appVersion"
).value=
app.version || "1.0.0";

document.getElementById(
"logoUrl"
).value=
app.logo || "";

document.getElementById(
"themeColor"
).value=
app.color || "#2563eb";

pages=
app.pages || [];

elements=
app.elements || [];

showPages();

updatePreview();

}catch(error){

console.log(error);

updatePreview();

}

}


loadApp();

</script>

</body>
  </html>
