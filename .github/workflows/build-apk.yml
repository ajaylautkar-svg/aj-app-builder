name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor project
        run: |
          npx cap init "AJ App Builder" "com.aj.appbuilder" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Fix Kotlin dependencies
        working-directory: android
        run: |
          echo "" >> build.gradle
          echo "configurations.all {" >> build.gradle
          echo "    resolutionStrategy.eachDependency { DependencyResolveDetails details ->" >> build.gradle
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
          echo "            details.useVersion '1.8.22'" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-App-Builder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
